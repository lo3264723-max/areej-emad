<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عيد زواج سعيد - أريج و عماد ✨</title>
    
    <!-- تحميل خطوط عربية راقية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-cream: #FDF8F5;
            --bg-blush: #FCEEE9;
            --env-front: #F9E5E1;
            --env-back: #F1D3CD;
            --env-flap: #F6DDD8;
            --gold-light: #EBD19E;
            --gold-primary: #C59B5F;
            --gold-dark: #9A743E;
            --rose-deep: #A44A58;
            --text-dark: #3B2F31;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            background: radial-gradient(circle at 50% 40%, var(--bg-cream) 0%, var(--bg-blush) 100%);
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* كانفاس القلوب المتطايرة */
        #heartsCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* إضاءة خلفية ناعمة */
        .ambient-glow {
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 180, 184, 0.28) 0%, rgba(253, 248, 245, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* حاوية المشهد ثلاثي الأبعاد */
        .scene {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* الظرف ثلاثي الأبعاد */
        .envelope-container {
            position: relative;
            width: 100%;
            max-width: 330px;
            height: 220px;
            perspective: 1200px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 60px;
        }

        .envelope-container:not(.is-open):hover {
            transform: translateY(-6px) scale(1.01);
        }

        .envelope-container.is-open {
            transform: translateY(75px);
            cursor: default;
        }

        /* جسم الظرف الخلفي */
        .envelope-back {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #F3D6D0 0%, #E8C2BA 100%);
            border-radius: 16px;
            box-shadow: 
                0 25px 50px -12px rgba(164, 74, 88, 0.22),
                0 0 0 1px rgba(197, 155, 95, 0.35);
            z-index: 1;
        }

        /* البطاقة الداخلية */
        .greeting-card {
            position: absolute;
            left: 5%;
            right: 5%;
            bottom: 10px;
            height: 195px;
            background: linear-gradient(180deg, #FFFFFF 0%, #FFFBF9 100%);
            border-radius: 14px;
            border: 1.5px solid rgba(197, 155, 95, 0.45);
            box-shadow: 0 10px 25px rgba(164, 74, 88, 0.12);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.25rem 1rem;
            transition: all 0.95s cubic-bezier(0.22, 1, 0.36, 1);
            transition-delay: 0.25s;
            overflow: hidden;
        }

        /* إطار ذهبي داخلي للبطاقة */
        .greeting-card::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(197, 155, 95, 0.3);
            border-radius: 9px;
            pointer-events: none;
        }

        /* حالة البطاقة بعد فتح الظرف */
        .envelope-container.is-open .greeting-card {
            transform: translateY(-145px) scale(1.06);
            height: 235px;
            z-index: 6;
            box-shadow: 
                0 25px 50px -10px rgba(164, 74, 88, 0.25),
                0 0 0 1px rgba(197, 155, 95, 0.5);
            cursor: pointer;
        }

        /* الجيب الأمامي للظرف */
        .envelope-pocket {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            border-radius: 16px;
            overflow: hidden;
        }

        .envelope-pocket::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #FBECE9 0%, #F5DAD4 100%);
            clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
        }

        /* خطوط طي الظرف لإعطاء عمق واقعي */
        .envelope-pocket::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(197, 155, 95, 0.14), transparent 55%);
            clip-path: polygon(0 100%, 50% 52%, 100% 100%);
        }

        /* غطاء الظرف العلوي المتحرك */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 125px;
            background: linear-gradient(180deg, #F2CFC8 0%, #F9E5E1 100%);
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top center;
            transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s linear 0.35s;
            z-index: 5;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            filter: drop-shadow(0 4px 6px rgba(164, 74, 88, 0.12));
        }

        .envelope-container.is-open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* الختم الشمعي الذهبي */
        .wax-seal {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #F3DFB6 0%, #C59B5F 55%, #8F6934 100%);
            box-shadow: 
                0 8px 18px rgba(143, 105, 52, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.65),
                inset 0 -3px 6px rgba(92, 65, 28, 0.45);
            z-index: 7;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .wax-seal::after {
            content: '';
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.45);
        }

        .envelope-container.is-open .wax-seal {
            opacity: 0;
            transform: translateX(-50%) scale(0.4);
            pointer-events: none;
        }

        /* نصوص البطاقة */
        .font-amiri {
            font-family: 'Amiri', serif;
        }
        .card-title {
            font-family: 'Amiri', serif;
            font-size: 1.95rem;
            font-weight: 700;
            color: var(--rose-deep);
            line-height: 1.3;
            letter-spacing: 0.01em;
        }

        .card-names {
            font-family: 'Amiri', serif;
            font-size: 1.85rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.4;
        }

        /* نص التوجيه السفلي */
        .tap-prompt {
            margin-top: 2.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--rose-deep);
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            padding: 0.55rem 1.4rem;
            border-radius: 9999px;
            border: 1px solid rgba(197, 155, 95, 0.35);
            box-shadow: 0 4px 15px rgba(164, 74, 88, 0.08);
            animation: softPulse 2.2s infinite ease-in-out;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .tap-prompt.hidden-prompt {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }

        @keyframes softPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* زر إعادة إطلاق القلوب */
        .replay-btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(197, 155, 95, 0.45);
            color: var(--rose-deep);
            padding: 0.5rem 1.1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 8px 20px rgba(164, 74, 88, 0.12);
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .replay-btn.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .replay-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        @media (max-width: 360px) {
            .envelope-container {
                max-width: 295px;
                height: 200px;
            }
            .card-title { font-size: 1.7rem; }
            .card-names { font-size: 1.65rem; }
        }
    </style>
</head>
<body>

    <!-- كانفاس القلوب المتطايرة -->
    <canvas id="heartsCanvas"></canvas>

    <!-- إضاءة خلفية ناعمة -->
    <div class="ambient-glow"></div>

    <!-- المشهد الرئيسي -->
    <main class="scene">
        <div id="envelope" class="envelope-container" onclick="handleEnvelopeClick()" role="button" aria-label="اضغط لفتح الظرف" tabindex="0">
            
            <!-- خلفية الظرف -->
            <div class="envelope-back"></div>

            <!-- البطاقة الداخلية -->
            <div class="greeting-card" onclick="handleCardClick(event)">
                <!-- زخرفة علوية -->
                <div class="flex items-center justify-center gap-2 mb-2 text-[#C59B5F]">
                    <span class="h-px w-8 bg-gradient-to-r from-transparent to-[#C59B5F]"></span>
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span class="h-px w-8 bg-gradient-to-l from-transparent to-[#C59B5F]"></span>
                </div>
                <!-- النص المطلوب فقط -->
                <h1 class="card-title mb-1">عيد زواج سعيد</h1>
                
                <div class="my-1.5 flex items-center justify-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#C59B5F]/60"></span>
                    <span class="w-2 h-2 rotate-45 border border-[#C59B5F]"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-[#C59B5F]/60"></span>
                </div>

                <h2 class="card-names mt-1">أريج &amp; عماد</h2>
            </div>

            <!-- الجيب الأمامي للظرف -->
            <div class="envelope-pocket"></div>

            <!-- الغطاء العلوي المتحرك -->
            <div class="envelope-flap"></div>

            <!-- الختم الشمعي الذهبي -->
            <div class="wax-seal">
                <svg class="w-7 h-7 text-white drop-shadow-sm" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
        </div>

        <!-- نص التوجيه -->
        <p id="tapPrompt" class="tap-prompt" onclick="handleEnvelopeClick()">
            اضغط لفتح الظرف
        </p>
    </main>

    <!-- زر لطيف لإعادة تطاير القلوب -->
    <button id="replayBtn" class="replay-btn" onclick="spawnHeartBurst(45)">
        <span>♥</span>
        <span>قلوب أكثر</span>
    </button>

    <script>
        let isOpened = false;
        const canvas = document.getElementById('heartsCanvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];
        let animationFrameId = null;

        // ألوان القلوب المتناغمة
        const heartColors = [
            '#D94E67', // وردي غامق
            '#E87A90', // وردي ناعم
            '#F2A6B3', // وردي فاتح
            '#C59B5F', // ذهبي دافئ
            '#B83B52', // قرمزي رومانسي
            '#F7C5CC'  // باستيل وردي
        ];

        // ضبط أبعاد الكانفاس لتناسب الشاشة بدقة عالية
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // كلاس القلب المتطاير
        class HeartParticle {
            constructor(originX, originY, isBurst = true) {
                this.x = originX + (Math.random() - 0.5) * (isBurst ? 90 : window.innerWidth);
                this.y = originY + (Math.random() - 0.5) * 30;
                this.size = isBurst ? (Math.random() * 11 + 7) : (Math.random() * 8 + 5);
                this.color = heartColors[Math.floor(Math.random() * heartColors.length)];
                this.speedY = isBurst ? -(Math.random() * 2.6 + 1.4) : -(Math.random() * 1.2 + 0.6);
                this.speedX = (Math.random() - 0.5) * (isBurst ? 2.4 : 0.6);
                this.wobbleSpeed = Math.random() * 0.04 + 0.02;
                this.wobbleOffset = Math.random() * Math.PI * 2;
                this.rotation = (Math.random() - 0.5) * 0.5;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.alpha = 0;
                this.maxAlpha = Math.random() * 0.35 + 0.65;
                this.life = 0;
                this.maxLife = Math.random() * 180 + 180;
            }

            update() {
                this.life++;
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.life * this.wobbleSpeed + this.wobbleOffset) * 0.65;
                this.rotation += this.rotationSpeed;

                // تباطؤ تدريجي للحركة الأفقية بعد الانفجار الأولي
                this.speedX *= 0.985;
                // ظهور ناعم وتلاشي تدريجي في النهاية
                if (this.life < 20) {
                    this.alpha = (this.life / 20) * this.maxAlpha;
                } else if (this.life > this.maxLife - 50) {
                    this.alpha = Math.max(0, ((this.maxLife - this.life) / 50) * this.maxAlpha);
                } else {
                    this.alpha = this.maxAlpha;
                }
            }

            draw(context) {
                context.save();
                context.translate(this.x, this.y);
                context.rotate(this.rotation);
                context.globalAlpha = this.alpha;
                context.fillStyle = this.color;

                const s = this.size;
                context.beginPath();
                context.moveTo(0, s * 0.3);
                context.bezierCurveTo(0, 0, -s * 0.5, 0, -s * 0.5, s * 0.3);
                context.bezierCurveTo(-s * 0.5, s * 0.65, 0, s * 0.9, 0, s * 1.1);
                context.bezierCurveTo(0, s * 0.9, s * 0.5, s * 0.65, s * 0.5, s * 0.3);
                context.bezierCurveTo(s * 0.5, 0, 0, 0, 0, s * 0.3);
                context.closePath();
                context.fill();
                context.restore();
            }
        }

        // إطلاق موجة قلوب من منتصف الظرف
        function spawnHeartBurst(count = 55) {
            const envRect = document.getElementById('envelope').getBoundingClientRect();
            const originX = envRect.left + envRect.width / 2;
            const originY = envRect.top + envRect.height * 0.45;

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    hearts.push(new HeartParticle(originX, originY, true));
                }, i * 18);
            }

            if (!animationFrameId) {
                animateHearts();
            }
        }

        // قلوب خفيفة مستمرة في الخلفية بعد الفتح
        let ambientInterval = null;
        function startAmbientHearts() {
            if (ambientInterval) return;
            ambientInterval = setInterval(() => {
                if (hearts.length < 60) {
                    hearts.push(new HeartParticle(window.innerWidth / 2, window.innerHeight + 20, false));
                }
            }, 450);
        }

        function animateHearts() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            for (let i = hearts.length - 1; i >= 0; i--) {
                const h = hearts[i];
                h.update();
                h.draw(ctx);

                if (h.life >= h.maxLife || h.y < -40) {
                    hearts.splice(i, 1);
                }
            }

            if (hearts.length > 0 || isOpened) {
                animationFrameId = requestAnimationFrame(animateHearts);
            } else {
                animationFrameId = null;
            }
        }

        // عند الضغط على الظرف
        function handleEnvelopeClick() {
            if (isOpened) return;
            isOpened = true;

            const envelope = document.getElementById('envelope');
            const prompt = document.getElementById('tapPrompt');
            const replayBtn = document.getElementById('replayBtn');

            envelope.classList.add('is-open');
            prompt.classList.add('hidden-prompt');

            // إطلاق القلوب المتطايرة لحظة خروج البطاقة
            setTimeout(() => {
                spawnHeartBurst(65);
                startAmbientHearts();
            }, 300);

            setTimeout(() => {
                replayBtn.classList.add('visible');
            }, 1300);
        }

        // عند الضغط على البطاقة بعد فتحها تتطاير قلوب إضافية
        function handleCardClick(event) {
            if (!isOpened) return;
            event.stopPropagation();
            spawnHeartBurst(35);
        }
        // دعم لوحة المفاتيح
        document.getElementById('envelope').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                handleEnvelopeClick();
            }
        });
    </script>
</body>
</html>
